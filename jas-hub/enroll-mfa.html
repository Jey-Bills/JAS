<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin security — Jey's Academic Studio</title><link href="../css/styles.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head>
<body><main class="admin-login-section"><div class="container"><div class="admin-login-wrap"><section class="admin-login-card"><div class="admin-login-head"><p class="eyebrow">Admin security</p><h1>Set up authenticator</h1><p>Scan this QR code using Authy, Google Authenticator, or another TOTP app, then verify the six-digit code.</p></div><p id="message" role="status" aria-live="polite"></p><div id="setup" hidden><div id="qr" class="admin-mfa-qr"></div><p><strong>Manual setup secret</strong></p><p id="secret" class="admin-mfa-secret"></p><form id="enroll-form" class="admin-login-form"><div class="field"><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="btn btn--gold admin-submit-btn" type="submit">Verify and enable</button></form></div><button class="btn btn--light" id="regenerate" type="button" hidden>Regenerate setup</button><p class="admin-login-footer"><a class="text-link" href="/jas-hub/">Back to dashboard</a></p></section></div></div></main>
<script type="module" src="../js/admin-mfa-enroll.js"></script></body></html>
