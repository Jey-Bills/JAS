<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify sign in — Jey's Academic Studio</title><link href="../css/styles.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head>
<body><main class="admin-login-section"><div class="container"><div class="admin-login-wrap"><section class="admin-login-card"><div class="admin-login-head"><p class="eyebrow">Admin security</p><h1>Two-factor verification</h1><p>Enter the six-digit code from your authenticator app.</p></div><p id="message" role="status" aria-live="polite"></p><form id="challenge-form" class="admin-login-form"><div class="field"><label for="code">6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="btn btn--gold admin-submit-btn" id="verify" type="submit">Verify</button></form><p class="admin-login-footer"><a class="text-link" id="logout" href="/jas-hub/login.html">Log out</a></p></section></div></div></main>
